<script>
let banner = document.querySelector('.banner');
let canvas = document.getElementById('dotsCanvas');
canvas.width = canvas.offsetWidth;
canvas.height = canvas.offsetHeight;
const ctx = canvas.getContext('2d');
let dots = [];
const arrayColors = ['#eee', '#545454', '#596d91', '#bb5a68', '#696541'];

function getRandomFloat(min, max) {
    return Math.random() * (max - min) + min;
}

function makeDot(canvas) {
    let speed = getRandomFloat(0.3, 1.2);
    let angle = getRandomFloat(0, 2 * Math.PI);
    return {
        x:  Math.floor(Math.random() * canvas.width),
        y:  Math.floor(Math.random() * canvas.height),
        size: getRandomFloat(5, 8),
        color: arrayColors[Math.floor(Math.random()* arrayColors.length)],
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        popping: false,
        popRadius: 0,
        popOpacity: 1
    };
}

function resetDot(dot, canvas) {
    let newDot = makeDot(canvas);
    dot.x = newDot.x;
    dot.y = newDot.y;
    dot.size = newDot.size;
    dot.color = newDot.color;
    dot.vx = newDot.vx;
    dot.vy = newDot.vy;
    dot.popping = false;
    dot.popRadius = 0;
    dot.popOpacity = 1;
}

for (let index = 0; index < 100; index++) {
    dots.push(makeDot(canvas));
}

function drawDots() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    dots.forEach(dot => {
        if(!dot.popping){
            ctx.fillStyle = dot.color;
            ctx.beginPath();
            ctx.arc(dot.x, dot.y, dot.size, 0, Math.PI*2);
            ctx.fill();
        } else {
            ctx.save();
            ctx.globalAlpha = dot.popOpacity;
            ctx.strokeStyle = dot.color;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(dot.x, dot.y, dot.popRadius, 0, Math.PI*2);
            ctx.stroke();
            ctx.restore();
        }
    });
}

function updateDots() {
    dots.forEach(dot => {
        if (!dot.popping) {
            dot.x += dot.vx;
            dot.y += dot.vy;
            // Bounce on boundaries
            if(dot.x < dot.size)    { dot.x = dot.size;    dot.vx *= -1; }
            if(dot.x > canvas.width - dot.size)  { dot.x = canvas.width - dot.size;   dot.vx *= -1; }
            if(dot.y < dot.size)    { dot.y = dot.size;    dot.vy *= -1; }
            if(dot.y > canvas.height - dot.size) { dot.y = canvas.height - dot.size;  dot.vy *= -1; }
        }
    });
}

function animate() {
    updateDots();
    drawDots();
    animatePops(); // Will only animate if any popping is happening
    requestAnimationFrame(animate);
}

function animatePops() {
    let animating = false;
    dots.forEach(dot => {
        if(dot.popping){
            animating = true;
            dot.popRadius += 2.5;
            dot.popOpacity -= 0.07;
            if(dot.popOpacity <= 0){
                resetDot(dot, canvas);
            }
        }
    });
    // drawDots() and rAF handled in animate()
}

animate();

banner.addEventListener('mousemove', (event) => {
    let mouse = {
        x:  event.pageX - banner.getBoundingClientRect().left,
        y:  event.pageY - banner.getBoundingClientRect().top
    }
    // draw connecting lines on top
    dots.forEach(dot => {
        let distance = Math.sqrt((mouse.x - dot.x) ** 2 + (mouse.y - dot.y) ** 2);
        if(distance < 300 && !dot.popping){
            ctx.strokeStyle = dot.color;
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(dot.x, dot.y);
            ctx.lineTo(mouse.x, mouse.y);
            ctx.stroke();
        }
    });
});

banner.addEventListener('mouseout', () => {
    // No need to clear, the next animation frame will do it
});

banner.addEventListener('click', (event) => {
    let mouse = {
        x:  event.pageX - banner.getBoundingClientRect().left,
        y:  event.pageY - banner.getBoundingClientRect().top
    };
    dots.forEach(dot => {
        let distance = Math.sqrt((mouse.x - dot.x) ** 2 + (mouse.y - dot.y) ** 2);
        if(distance <= dot.size + 7 && !dot.popping){
            dot.popping = true;
            dot.popRadius = dot.size;
            dot.popOpacity = 1;
        }
    });
});

window.addEventListener('resize', () => {
    canvas.width = banner.offsetWidth;
    canvas.height = banner.offsetHeight;

    dots = [];
    for (let index = 0; index < 50; index++) {
        dots.push(makeDot(canvas));
    }
});
</script>
